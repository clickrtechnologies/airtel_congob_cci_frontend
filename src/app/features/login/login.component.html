<div class="login-container">
    <div class="login-wrapper">
   <div class="banner">
  <h1>Moov Tones</h1>

  <img
    src="assets/Moov_Africa_logo.png"
    alt="Moov Africa Logo"
    class="banner-logo">
</div>

  <div class="login-card">

    <h2>CCI Portal</h2>

    <div class="form-group">
      <label>Username</label>
      <input
        type="text"
        [(ngModel)]="username"
        placeholder="Enter Username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Enter Password">
    </div>

    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <button (click)="login()">
      Login
    </button>

  </div>

</div>
